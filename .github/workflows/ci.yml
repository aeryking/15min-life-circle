name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: 格式检查 · 代码规范 · 单元测试 · 构建（Node ${{ matrix.node }}）
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prettier 格式检查
        run: npx prettier --check .
      - name: ESLint 代码规范
        run: npx eslint .
      - name: 单元测试 + 离线回放端到端测试（无需 AK、无外部网络）
        run: npm test
        env:
          DATA_MODE: replay
      - name: 构建前端
        run: npm run build

  docker:
    name: Docker 镜像构建与冒烟测试
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t life-circle-checkup:ci .
      - name: 容器冒烟测试（离线回放模式）
        run: |
          docker run -d --name lc -p 8787:8787 life-circle-checkup:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8787/api/health && break; sleep 1; done
          curl -sf http://localhost:8787/api/config | grep -q '"dataMode":"replay"'
          curl -sfN "http://localhost:8787/api/analyze/stream?lng=116.321286&lat=40.0385&tier=standard" | grep -q "event: done"
          docker logs lc
